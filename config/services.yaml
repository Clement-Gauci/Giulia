# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    giulia.data_dir: '%kernel.project_dir%/config/giulia'
    contact.from_email: '%env(CONTACT_FROM_EMAIL)%'
    contact.to_email: '%env(CONTACT_TO_EMAIL)%'
    giulia.ga_measurement_id: '%env(default::GA_MEASUREMENT_ID)%'
    giulia.site_url: '%env(DEFAULT_URI)%'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            $siteUrl: '%giulia.site_url%'

    App\:
        resource: '../src/'
        exclude:
            - '../src/**/Domain/'
            - '../src/Kernel.php'

    # Alias ports → adapters
    App\Opening\Domain\Clock: '@App\Opening\Infrastructure\SystemClock'
    App\Opening\Domain\ScheduleRepositoryInterface: '@App\Opening\Infrastructure\YamlScheduleRepository'
    App\Opening\Domain\ClosureRepositoryInterface: '@App\Opening\Infrastructure\YamlClosureRepository'
    App\Menu\Domain\MenuRepositoryInterface: '@App\Menu\Infrastructure\YamlMenuRepository'
    App\Shared\Domain\EstablishmentRepositoryInterface: '@App\Shared\Infrastructure\YamlEstablishmentRepository'
    App\Contact\Domain\ContactMailerInterface: '@App\Contact\Infrastructure\SymfonyContactMailer'
    App\Menu\Domain\SpecialRepositoryInterface: '@App\Menu\Infrastructure\YamlSpecialRepository'
    App\Legal\Domain\LegalRepositoryInterface: '@App\Legal\Infrastructure\YamlLegalRepository'

    # Chemins des sources de données
    App\Opening\Infrastructure\YamlScheduleRepository:
        arguments: { $file: '%giulia.data_dir%/hours.yaml' }
    App\Opening\Infrastructure\YamlClosureRepository:
        arguments: { $file: '%giulia.data_dir%/closures.yaml' }
    App\Menu\Infrastructure\YamlMenuRepository:
        arguments: { $file: '%giulia.data_dir%/menu.yaml' }
    App\Menu\Infrastructure\YamlSpecialRepository:
        arguments: { $file: '%giulia.data_dir%/special.yaml' }
    App\Shared\Infrastructure\YamlEstablishmentRepository:
        arguments: { $file: '%giulia.data_dir%/establishment.yaml' }
    App\Legal\Infrastructure\YamlLegalRepository:
        arguments: { $file: '%giulia.data_dir%/legal.yaml' }
    App\Contact\Infrastructure\SymfonyContactMailer:
        arguments: { $fromEmail: '%contact.from_email%', $toEmail: '%contact.to_email%' }
    # Le nom du champ leurre et la signature du jeton dérivent du secret du
    # site : ils sont propres à cette installation.
    App\Contact\AntiSpam\FormSignature:
        arguments: { $secret: '%kernel.secret%' }

    App\Menu\UI\MenuPdfExtension:
        arguments: { $publicDir: '%kernel.project_dir%/public' }

# En test, le mailer de contact doit rester public (non inliné) pour être
# remplaçable par un double qui échoue, afin de vérifier la gestion gracieuse
# des erreurs d'envoi côté contrôleur. On répète les arguments car une seconde
# définition du même service la remplace (elle ne la fusionne pas).
when@test:
    services:
        # Les tests fonctionnels antidatent le jeton du formulaire pour simuler
        # un visiteur qui prend le temps de le remplir.
        App\Contact\AntiSpam\FormSignature:
            public: true
            arguments: { $secret: '%kernel.secret%' }

        App\Contact\Infrastructure\SymfonyContactMailer:
            public: true
            autowire: true
            arguments: { $fromEmail: '%contact.from_email%', $toEmail: '%contact.to_email%' }

        # Même raison pour la pizza du moment : les tests de la page d'accueil
        # injectent un double plutôt que de dépendre de l'état éditorial de
        # special.yaml (qui s'active et se désactive au fil des éditions).
        App\Menu\Infrastructure\YamlSpecialRepository:
            public: true
            arguments: { $file: '%giulia.data_dir%/special.yaml' }
