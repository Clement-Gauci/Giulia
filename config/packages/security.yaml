security:
    # Aucun mot de passe n'est stocké : la connexion au dashboard se fait par code
    # à 6 chiffres envoyé par e-mail (voir src/Account). Pas de password_hashers.

    providers:
        accounts:
            id: App\Account\Infrastructure\Security\AccountUserProvider

    role_hierarchy:
        # Un gérant peut tout ce que peut la boutique ; l'inverse est faux.
        ROLE_MANAGER: [ROLE_SHOP]

    firewalls:
        dev:
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false

        admin:
            pattern: ^/admin
            lazy: true
            provider: accounts
            custom_authenticator: App\Account\Infrastructure\Security\LoginCodeAuthenticator

            remember_me:
                secret: '%kernel.secret%'
                lifetime: 2592000 # 30 jours, comme l'annonce l'écran de connexion
                path: /admin
                samesite: lax
                # Le défaut (`password`) n'existe pas ici. Signer sur le rôle et
                # l'état actif fait qu'un changement de rôle ou une révocation
                # invalide immédiatement tous les cookies déjà émis.
                signature_properties: ['role', 'active']

            logout:
                path: admin_logout
                target: admin_login

        main:
            lazy: true
            provider: accounts

    access_control:
        # L'écran de connexion vit sous /admin : il doit rester ouvert.
        - { path: ^/admin/connexion, roles: PUBLIC_ACCESS }
        - { path: ^/admin, roles: ROLE_SHOP }

# Pas de bloc `when@test` : le fichier du squelette y abaissait le coût des
# algorithmes de hachage de mots de passe, dont ce projet n'a plus l'usage.
