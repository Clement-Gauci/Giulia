framework:
    messenger:
        # AUCUN transport déclaré, volontairement.
        #
        # Le projet envoie ses e-mails de façon SYNCHRONE (formulaire de contact,
        # code de connexion, ouverture d'accès) : rien n'est routé, aucun worker
        # `messenger:consume` ne tourne. Un transport `doctrine://default`
        # inutilisé n'était pas neutre : son écouteur de schéma ajoutait une table
        # `messenger_messages` aux migrations, pour une file que personne ne
        # consomme. Le jour où un traitement asynchrone sera vraiment nécessaire,
        # on redéclarera un transport et on routera explicitement le message.
        default_bus: messenger.bus.default

        buses:
            messenger.bus.default: []
