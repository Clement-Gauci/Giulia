doctrine:
    dbal:
        # `serverVersion` est porté par le DSN (voir .env) : DBAL s'en sert pour
        # adapter le SQL qu'il génère.
        url: '%env(resolve:DATABASE_URL)%'

        profiling_collect_backtrace: '%kernel.debug%'
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity

        # Un mapping par contexte métier, plutôt qu'un `src/Entity` fourre-tout :
        # les entités vivent dans l'Infrastructure du contexte qu'elles servent,
        # à côté du repository qui les traduit en objets du domaine.
        auto_mapping: false
        mappings:
            Account:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Account/Infrastructure/Doctrine'
                prefix: 'App\Account\Infrastructure\Doctrine'

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
